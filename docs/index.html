<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt Studio</title><link rel="stylesheet" href="./style.css"></head>
<body><header><div><div class="brand">✳ Prompt Studio</div><div class="sub">個人 Prompt Library · GitHub Pages</div></div><div class="right">READ ONLY</div></header>
<main class="shell"><aside class="panel sidebar"><h2>探索 Prompt</h2><div class="muted">搜尋、分類與最後更新日期</div>
<input id="search" type="search" placeholder="搜尋標題、標籤、專案..."><select id="sort" aria-label="排序方式"><option value="updated">最近更新優先</option><option value="title">名稱排序</option><option value="id">ID 排序</option></select><div class="stats" id="filters"></div><p class="muted" id="count"></p><div id="items"></div></aside>
<section class="panel content" id="detail"></section></main>
<footer><span id="source">載入中...</span> · 此網站為唯讀 Prompt Library。</footer>
<script src="./app.js"></script></body></html>
